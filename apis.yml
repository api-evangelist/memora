name: Memora
description: >-
  Memora Health is a healthcare technology company (now part of Commure) that
  digitizes and automates complex care programs for health systems, payors, and
  digital health partners. Its AI-backed platform mends fragmented clinical
  workflows, powers top-of-license care, and engages patients across maternal,
  surgical, gastrointestinal, cancer, chronic, population-health, and
  transitions-of-care programs through intelligent care navigation, remote
  patient monitoring, automated check-ins, and patient-reported outcomes
  collection. Added to the API Evangelist network as an a16z portfolio lead;
  the company publishes no public API, developer portal, or documentation, so
  there is no API surface to enrich at this time.
